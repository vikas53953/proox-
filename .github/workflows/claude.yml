# Claude Code GitHub Action — owner-approved builder automation (not part of the product).
# The owner (or his assistant, posting as the owner's account) tags @claude on an issue or
# PR; Claude replies in the same thread. Claude never merges: merges need the owner.
#
# NOTE: GitHub runs comment/issue-triggered workflows only from the DEFAULT branch, so this
# file does nothing until it is merged into `main`.
#
# Pins (RC12, see BOM.md): actions are pinned to full commit SHAs, not moving tags.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# One run at a time per issue/PR; a new mention does not cancel a run in progress.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the repository owner can trigger it (the action also refuses users without
    # write access and all bots). Text from anyone else is never acted on.
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push work to its own branches (never merges; protect main/feat branches)
      pull-requests: write # reply on PRs, open PRs
      issues: write # reply on issues
      id-token: write # required by the action to authenticate (per the official docs)
      actions: read # read CI results on PRs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-5-5 --max-turns 30"
