# CI: the full test suite on the pinned stack (Python 3.13.15, PostgreSQL 17.11) + ruff.
# Pins (RC12, see BOM.md): actions are pinned to full commit SHAs, not moving tags.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database, no password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DESK_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: |
          pytest -q tests
